name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto website
        run: quarto render

      - name: Verify output structure
        run: |
          echo "=== _site contents ==="
          ls -la _site/
          echo "=== site_libs contents ==="
          ls -la _site/site_libs/
          test -f _site/index.html     || (echo "ERROR: _site/index.html missing!" && exit 1)
          test -d _site/site_libs      || (echo "ERROR: _site/site_libs/ missing!" && exit 1)
          test -f _site/.nojekyll      || (echo "ERROR: _site/.nojekyll missing!" && exit 1)
          echo "All required files present."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
