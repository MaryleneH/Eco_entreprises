<script>
(function () {
  // Detect path offset from Quarto's own site_libs links (adjusted per page depth)
  var el = document.querySelector(
    'script[src^="site_libs/"], link[href^="site_libs/"],' +
    'script[src*="/site_libs/"], link[href*="/site_libs/"]'
  );
  var offset = '';
  if (el) {
    var src = el.getAttribute('src') || el.getAttribute('href') || '';
    var match = src.match(/^((?:\.\.\/)+)/);
    if (match) { offset = match[1]; }
  }
  var s = document.createElement('script');
  s.src = offset + 'scripts.js';
  document.body.appendChild(s);
}());
</script>
